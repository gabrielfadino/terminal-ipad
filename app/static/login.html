<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Terminal · Entrar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Terminal">
<link rel="apple-touch-icon" href="/icone.png">
<style>
html,body{margin:0;height:100%;background:#0b0d10;color:#e8eaed;font:16px -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.caixa{width:320px;margin:0 auto;padding-top:140px;text-align:center}
.logo{width:72px;height:72px;border-radius:16px;margin:0 auto 18px;display:block}
h1{font-size:24px;font-weight:600;margin:0 0 6px}
p{color:#9aa0a6;font-size:14px;margin:0 0 24px}
input{display:block;width:100%;box-sizing:border-box;padding:14px;font-size:18px;background:#16191d;color:#fff;border:1px solid #2a2f35;border-radius:10px;-webkit-appearance:none;margin-bottom:12px;text-align:center}
button{display:block;width:100%;padding:14px;font-size:17px;font-weight:600;background:#2f6fed;color:#fff;border:0;border-radius:10px;-webkit-appearance:none;font-family:inherit}
.msg{color:#f28b82;font-size:14px;min-height:20px;margin-top:14px}
</style>
</head>
<body>
<div class="caixa">
  <img class="logo" src="/icone.png" alt="">
  <h1>Terminal</h1>
  <p>Computador virtual na tela do iPad</p>
  <form method="post" action="/login">
    <input type="password" name="senha" placeholder="Senha" autofocus autocomplete="current-password">
    <button type="submit">Entrar</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  var q = window.location.search;
  var m = document.getElementById('msg');
  if (q.indexOf('erro=1') >= 0) { m.textContent = 'Senha incorreta.'; }
  if (q.indexOf('bloqueado=1') >= 0) { m.textContent = 'Muitas tentativas erradas. Aguarde 15 minutos.'; }
})();
</script>
</body>
</html>
