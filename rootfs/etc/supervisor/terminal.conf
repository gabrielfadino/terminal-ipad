[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:tela]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_LARGURA)sx%(ENV_ALTURA)sx24 -nolisten tcp -dpi 96
user=terminal
environment=HOME="/home/terminal",USER="terminal"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:som]
command=/usr/local/bin/som.sh
user=terminal
environment=HOME="/home/terminal",USER="terminal",XDG_RUNTIME_DIR="/run/user/1000"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:area-de-trabalho]
command=/usr/local/bin/area-de-trabalho.sh
user=terminal
environment=HOME="/home/terminal",USER="terminal",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:servidor]
command=/usr/bin/python3 /opt/terminal/server.py
user=terminal
environment=HOME="/home/terminal",USER="terminal",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
